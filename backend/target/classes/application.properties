# Принудительная UTF-8 кодировка для JDBC
spring.datasource.url=jdbc:postgresql://localhost:5432/sushi_mag_db?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=sushi_user
spring.datasource.password=sushi_password

# create-drop ПОЛНОСТЬЮ УДАЛИТ и создаст таблицы заново при каждом запуске!
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.application.name=sushi-mag-backend